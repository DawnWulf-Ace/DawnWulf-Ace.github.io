<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The OmniStreamer - Multi-Stream Viewer</title>
  <style>
    :root {
      --bg-color: #0e0e10;
      --header-bg: #18181b;
      --border-color: #2d2d31;
      --text-color: #ffffff;
      --card-bg: #1f1f23;
      --input-bg: #0f0f11;
      --logo-glow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #0ff;
      --sidebar-width: 260px;
    }

    body.light-mode {
      --bg-color: #f3f4f6;
      --header-bg: #ffffff;
      --border-color: #d1d5db;
      --text-color: #111827;
      --card-bg: #e5e7eb;
      --input-bg: #ffffff;
      --logo-glow: 0 0 2px #ff00ff, 0 0 5px #ff00ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, color 0.3s; }
    
    header { height: 60px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; transition: background 0.3s; z-index: 10; }
    
    .logo-container { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-weight: 900; font-size: 24px; font-style: italic; color: var(--text-color); text-transform: uppercase; letter-spacing: 2px; text-shadow: var(--logo-glow); transition: text-shadow 0.3s; }

    .btn-icon { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); font-size: 18px; padding: 6px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: var(--card-bg); }

    .layout-controls { display: flex; gap: 8px; align-items: center; margin-right: auto; margin-left: 20px; }
    select { background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; outline: none; cursor: pointer; }

    .input-group { display: flex; gap: 8px; flex: 1; max-width: 600px; }
    input { flex: 1; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-color); outline: none; }
    .btn-primary { padding: 8px 16px; background: #9146ff; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
    .btn-primary:hover { background: #772ce8; }
    
    /* Layout Wrapper for Sidebar + Grid */
    .main-wrapper { flex: 1; display: flex; overflow: hidden; }

    /* Twitch Sidebar */
    .sidebar { width: var(--sidebar-width); background: var(--header-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: margin-left 0.3s ease; }
    .sidebar.closed { margin-left: calc(var(--sidebar-width) * -1); }
    
    .sidebar-header { padding: 12px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
    
    /* Live Channel Items */
    .live-channel { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
    .live-channel:hover { background: var(--card-bg); border-color: var(--border-color); }
    .channel-name { font-weight: bold; font-size: 14px; }
    .channel-meta { font-size: 12px; color: #a1a1aa; margin-top: 2px; }
    .channel-title { font-size: 11px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
    .live-dot { color: #ef4444; font-size: 10px; margin-right: 4px; }

    .app-container { flex: 1; display: flex; overflow: hidden; background: #000; }
    .streams-grid { flex: 1; display: grid; gap: 8px; padding: 8px; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); auto-rows: 1fr; }
    
    .stream-card { background: var(--header-bg); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: opacity 0.2s; border: 1px solid var(--border-color); }
    .stream-header { height: 32px; background: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; cursor: grab; user-select: none; }
    .stream-header:active { cursor: grabbing; }
    .drag-handle { color: #a1a1aa; margin-right: 8px; cursor: inherit; }
    .stream-card.dragging { opacity: 0.4; border: 2px dashed #ff00ff; }
    body.is-dragging iframe { pointer-events: none; }
    
    .stream-content { flex: 1; display: flex; }
    .video-frame { flex: 1; border: none; height: 100%; width: 100%; }
    
    .layout-side .stream-content { flex-direction: row; }
    .layout-side .chat-frame { width: 300px; height: 100%; border-left: 1px solid var(--border-color); border-top: none; display: block; }
    .layout-bottom .stream-content { flex-direction: column; }
    .layout-bottom .chat-frame { width: 100%; height: 250px; border-top: 1px solid var(--border-color); border-left: none; display: block; }
    .layout-hidden .chat-frame { display: none; }

    .btn-remove { background: transparent; color: #a1a1aa; border: none; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .btn-remove:hover { color: #ef4444; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <button class="btn-icon" onclick="toggleSidebar()" title="Toggle Dashboard">☰</button>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff00ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 5px #ff00ff);">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        <path d="M2 12h20"></path>
      </svg>
      <div class="logo-text">OMNISTREAMER</div>
    </div>
    
    <div class="layout-controls">
      <button class="btn-icon" onclick="toggleTheme()" title="Toggle Dark/Light Mode" id="themeIcon">🌓</button>
      <label for="layoutMode" style="font-size: 13px; color: #a1a1aa; margin-left: 12px;">Layout:</label>
      <select id="layoutMode" onchange="updateLayout()">
        <option value="layout-side">Side</option>
        <option value="layout-bottom">Bottom</option>
        <option value="layout-hidden">Hidden</option>
      </select>
    </div>

    <div class="input-group">
      <input type="text" id="streamUrl" placeholder="Paste Twitch, YouTube, or Kick channel URL...">
      <button class="btn-primary" onclick="addStream()">Add Stream</button>
    </div>
  </header>

  <div class="main-wrapper">
    <!-- NEW: Twitch Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Twitch Live Dashboard</span>
      </div>
      <div class="sidebar-content" id="sidebarContent">
        <div style="text-align: center; padding: 20px 10px;">
          <p style="font-size: 13px; color: #a1a1aa; margin-bottom: 12px;">Connect to Twitch to see who is live right now.</p>
          <button class="btn-primary" style="width: 100%;" onclick="loginTwitch()">Login with Twitch</button>
        </div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="app-container layout-side" id="appContainer">
      <div class="streams-grid" id="streamsGrid"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. ADD YOUR TWITCH CLIENT ID HERE
    // ==========================================
    const TWITCH_CLIENT_ID = 'YOUR_CLIENT_ID_HERE'; 

    const DOMAIN = window.location.hostname; 
    const streamsGrid = document.getElementById('streamsGrid');
    let draggedCard = null;
    let twitchAccessToken = null;
    let twitchUserId = null;

    // --- Sidebar & Auth Logic ---
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('closed');
    }

    function loginTwitch() {
      if (TWITCH_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
        alert("Setup Required: You need to add a Twitch Client ID to the code first. Read the setup instructions!");
        return;
      }
      // Redirects to Twitch to ask for permission to read your follows
      const redirectUri = window.location.href.split('#')[0];
      const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=user:read:follows`;
      window.location.href = authUrl;
    }

    // Check if we just came back from Twitch Login
    function checkTwitchAuth() {
      const hash = window.location.hash;
      if (hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        twitchAccessToken = params.get('access_token');
        // Clear the token from the URL bar so it doesn't look messy
        window.history.replaceState(null, null, window.location.pathname);
        fetchTwitchUser();
      }
    }

    async function fetchTwitchUser() {
      document.getElementById('sidebarContent').innerHTML = '<div style="padding: 12px; text-align: center;">Loading...</div>';
      try {
        const res = await fetch('https://api.twitch.tv/helix/users', {
          headers: { 'Authorization': `Bearer ${twitchAccessToken}`, 'Client-Id': TWITCH_CLIENT_ID }
        });
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          twitchUserId = data.data[0].id;
          document.querySelector('.sidebar-header').innerHTML = `
            <span>Live Follows</span>
            <span style="font-size: 11px; font-weight: normal; color: #a1a1aa;">${data.data[0].display_name}</span>
          `;
          fetchLiveFollows();
          // Refresh live list every 2 minutes
          setInterval(fetchLiveFollows, 120000);
        }
      } catch (err) {
        console.error("Twitch API Error", err);
      }
    }

    async function fetchLiveFollows() {
      try {
        const res = await fetch(`https://api.twitch.tv/helix/streams/followed?user_id=${twitchUserId}`, {
          headers: { 'Authorization': `Bearer ${twitchAccessToken}`, 'Client-Id': TWITCH_CLIENT_ID }
        });
        const data = await res.json();
        renderLiveChannels(data.data);
      } catch (err) {
        console.error("Twitch API Error", err);
      }
    }

    function renderLiveChannels(channels) {
      const content = document.getElementById('sidebarContent');
      if (!channels || channels.length === 0) {
        content.innerHTML = '<div style="padding: 12px; font-size: 13px; color: #a1a1aa; text-align: center;">No followed channels are live.</div>';
        return;
      }
      
      content.innerHTML = channels.map(c => `
        <div class="live-channel" onclick="addStreamFromSidebar('${c.user_name}')">
          <div class="channel-name">${c.user_name}</div>
          <div class="channel-meta"><span class="live-dot">●</span> ${c.viewer_count.toLocaleString()} viewers • ${c.game_name}</div>
          <div class="channel-title">${c.title}</div>
        </div>
      `).join('');
    }

    function addStreamFromSidebar(username) {
      document.getElementById('streamUrl').value = `https://twitch.tv/${username}`;
      addStream();
    }

    // --- General App Logic ---
    function toggleTheme() {
      const body = document.body;
      body.classList.toggle('light-mode');
      document.getElementById('themeIcon').textContent = body.classList.contains('light-mode') ? '☀️' : '🌓';
    }

    function updateLayout() {
      const container = document.getElementById('appContainer');
      const mode = document.getElementById('layoutMode').value;
      container.className = 'app-container ' + mode;
    }

    function parseStreamUrl(url) {
      if (url.includes('twitch.tv/')) {
        const id = url.split('twitch.tv/')[1].split('/')[0].split('?')[0];
        return { platform: 'twitch', id };
      }
      if (url.includes('youtube.com/watch') || url.includes('youtu.be/')) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        if (match && match[2].length === 11) return { platform: 'youtube', id: match[2] };
      }
      if (url.includes('kick.com/')) {
        const id = url.split('kick.com/')[1].split('/')[0].split('?')[0];
        return { platform: 'kick', id };
      }
      return null;
    }

    function getEmbedUrls(platform, id) {
      switch (platform) {
        case 'twitch': return { video: `https://player.twitch.tv/?channel=${id}&parent=${DOMAIN}&muted=true`, chat: `https://www.twitch.tv/embed/${id}/chat?parent=${DOMAIN}` };
        case 'youtube': return { video: `https://www.youtube.com/embed/${id}?autoplay=1&mute=1`, chat: `https://www.youtube.com/live_chat?v=${id}&embed_domain=${DOMAIN}` };
        case 'kick': return { video: `https://player.kick.com/${id}`, chat: `https://kick.com/popout/${id}/chat` };
      }
    }

    function addStream() {
      if (streamsGrid.children.length >= 6) { alert('Maximum of 6 streams allowed.'); return; }
      const input = document.getElementById('streamUrl');
      const parsed = parseStreamUrl(input.value.trim());
      if (!parsed) { alert('Please enter a valid Twitch, YouTube, or Kick URL.'); return; }

      const { video, chat } = getEmbedUrls(parsed.platform, parsed.id);
      const card = document.createElement('div');
      card.className = 'stream-card';
      card.draggable = true;
      
      card.innerHTML = `
        <div class="stream-header">
          <div style="display: flex; align-items: center;">
            <span class="drag-handle">⠿</span>
            <span><strong>${parsed.platform.toUpperCase()}</strong>: ${parsed.id}</span>
          </div>
          <button class="btn-remove" title="Remove stream" onclick="this.closest('.stream-card').remove()">✕</button>
        </div>
        <div class="stream-content">
          <iframe class="video-frame" src="${video}" allowfullscreen></iframe>
          <iframe class="chat-frame" src="${chat}"></iframe>
        </div>
      `;

      card.addEventListener('dragstart', function(e) { draggedCard = this; setTimeout(() => this.classList.add('dragging'), 0); document.body.classList.add('is-dragging'); });
      card.addEventListener('dragend', function() { draggedCard = null; this.classList.remove('dragging'); document.body.classList.remove('is-dragging'); });
      card.addEventListener('dragover', function(e) {
        e.preventDefault(); 
        if (this === draggedCard) return;
        const rect = this.getBoundingClientRect();
        streamsGrid.insertBefore(draggedCard, e.clientX < (rect.x + rect.width / 2) ? this : this.nextSibling);
      });

      streamsGrid.appendChild(card);
      input.value = '';
    }

    // Run on load
    checkTwitchAuth();
  </script>
</body>
</html>

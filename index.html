<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OmniStreamer // Retro Synthwave Multi-Stream</title>
  <!-- Load official Twitch Embed JavaScript SDK -->
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <style>
    /* --- Theming Variables (Dark Mode Default) --- */
    :root {
      --bg-color: #0c0c14;
      --header-bg: #13131f;
      --card-bg: #181825;
      --border-color: #2a2a3c;
      --accent-primary: #ff007f; /* Neon Magenta */
      --accent-secondary: #00f0ff; /* Laser Cyan */
      --accent-glow: rgba(255, 0, 127, 0.4);
      --text-main: #f4f4f5; 
      --text-muted: #a1a1aa;
    }

    /* --- Light Mode Theme Override (Adaptive Contrast) --- */
    body.light-mode {
      --bg-color: #f4f4f6;
      --header-bg: #e4e4e7;
      --card-bg: #ffffff;
      --border-color: #d4d4d8;
      --text-main: #0c0c14; 
      --text-muted: #71717a;
      --accent-glow: rgba(255, 0, 127, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* --- Header --- */
    header {
      background: var(--header-bg);
      border-bottom: 2px solid var(--accent-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      height: 60px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-secondary);
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--accent-secondary);
    }

    .header-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .live-clock {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
      letter-spacing: 1px;
      padding: 4px 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .theme-toggle-btn, .action-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .theme-toggle-btn:hover, .action-btn:hover {
      border-color: var(--accent-secondary);
    }

    /* --- Main Layout --- */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    sidebar {
      width: 260px;
      background: var(--header-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .sidebar-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .followed-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .streamer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .streamer-item:hover {
      border-color: var(--accent-secondary);
    }

    /* --- Dynamic Workspace --- */
    .workspace {
      flex: 1;
      padding: 15px;
      overflow: hidden;
      display: flex;
      gap: 15px;
    }

    /* Standard Grid Layout */
    .streams-grid {
      flex: 1;
      display: grid;
      gap: 15px;
      overflow-y: auto;
    }

    /* Showstopper Layout: Spotlight 50% (flex: 2), Stacked Pane 25% (flex: 1) */
    .workspace.showstopper-mode {
      display: flex;
      flex-direction: row;
    }

    .workspace.showstopper-mode .spotlight-pane {
      flex: 2; /* 50% Width Spotlight */
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .workspace.showstopper-mode .stack-pane {
      flex: 1; /* 25% Width Stacked Column */
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 250px;
    }

    /* In Showstopper Stack, cards dynamically resize to fit remaining height perfectly */
    .workspace.showstopper-mode .stack-pane .stream-card {
      flex: 1;
      min-height: 0;
    }

    .stream-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .stream-header {
      background: var(--header-bg);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .stream-actions {
      display: flex;
      gap: 6px;
    }

    .stream-actions button {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }

    .stream-actions button:hover {
      border-color: var(--accent-secondary);
    }

    .stream-content {
      flex: 1;
      position: relative;
      background: #000;
    }

    .twitch-player-target {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    /* --- Retro Inactivity Warning Modal --- */
    .inactivity-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 8, 0.85);
      backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }

    .inactivity-modal-box {
      background: var(--header-bg);
      border: 2px solid var(--accent-primary);
      box-shadow: 0 0 30px var(--accent-glow);
      border-radius: 8px;
      width: 460px;
      max-width: 90%;
      overflow: hidden;
      animation: modalPulse 2s infinite alternate;
    }

    @keyframes modalPulse {
      0% { box-shadow: 0 0 15px var(--accent-glow); }
      100% { box-shadow: 0 0 35px var(--accent-primary); }
    }

    .inactivity-modal-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--accent-primary);
    }

    .inactivity-modal-body {
      padding: 20px 16px;
      text-align: center;
    }

    .inactivity-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .inactivity-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .inactivity-modal-footer {
      padding: 14px 16px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
    }

    .inactivity-btn {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      letter-spacing: 1px;
      background: var(--accent-primary);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .inactivity-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="logo">OMNISTREAMER // v2.0</div>
    <div class="header-controls">
      <div id="liveClock" class="live-clock">00:00:00</div>
      <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">🌙</button>
      <button id="authBtn" style="background:var(--accent-secondary); border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">TWITCH LOGIN</button>
    </div>
  </header>

  <!-- Main Multi-Stream Workspace -->
  <div class="main-container">
    <sidebar>
      <div class="sidebar-title">Live Follows</div>
      <div class="followed-list" id="followedList">
        <div class="streamer-item" onclick="addStream('ninja')"><span>🔴 ninja</span></div>
        <div class="streamer-item" onclick="addStream('shroud')"><span>🔴 shroud</span></div>
        <div class="streamer-item" onclick="addStream('tarik')"><span>🔴 tarik</span></div>
        <div class="streamer-item" onclick="addStream('summit1g')"><span>🔴 summit1g</span></div>
      </div>
    </sidebar>

    <!-- Workspace Container -->
    <div id="workspace" class="workspace">
      <div id="streamsContainer" class="streams-grid"></div>
    </div>
  </div>

  <!-- Retro Inactivity Warning Modal -->
  <div id="inactivityModal" class="inactivity-modal-overlay" style="display: none;">
    <div class="inactivity-modal-box">
      <div class="inactivity-modal-header">
        ⚠ FEED IDLE // NO SIGNAL DETECTED
      </div>
      <div class="inactivity-modal-body">
        <div class="inactivity-title">BANDWIDTH SAVER ALERT // STILL WATCHING THE FEED?</div>
        <div class="inactivity-desc">Your multi-stream grid is about to drop down to solo mode to save bandwidth in: <span id="inactivityCountdown" style="color: var(--accent-primary); font-weight: bold;">02:00</span></div>
      </div>
      <div class="inactivity-modal-footer">
        <button class="inactivity-btn" onclick="resetInactivityTimer()">[ KEEP THE CHANNELS ALIVE 🕹 ]</button>
      </div>
    </div>
  </div>

  <script>
    // --- State Management ---
    let activeStreams = [];
    let twitchPlayers = {};
    let showstopperChannel = null;
    const workspace = document.getElementById('workspace');
    const streamsContainer = document.getElementById('streamsContainer');

    // --- Live Clock Logic ---
    function updateClock() {
      const now = new Date();
      const timeString = now.toTimeString().split(' ')[0];
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Theme Switcher Logic ---
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const btn = document.getElementById('themeToggleBtn');
      btn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    // --- Workspace Rendering ---
    function renderWorkspace() {
      streamsContainer.innerHTML = '';
      twitchPlayers = {};

      if (activeStreams.length === 0) {
        workspace.className = 'workspace';
        streamsContainer.style.display = 'flex';
        streamsContainer.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:var(--text-muted); font-size:14px;">Select live channels from the sidebar to begin transmission.</div>`;
        return;
      }

      const isShowstopper = showstopperChannel && activeStreams.includes(showstopperChannel) && activeStreams.length > 1;

      if (isShowstopper) {
        // --- SHOWSTOPPER 50% SPOTLIGHT & 25% STACKED LAYOUT ---
        workspace.className = 'workspace showstopper-mode';
        
        // 1. Spotlight Pane (Takes 50% width via flex: 2)
        const spotlightPane = document.createElement('div');
        spotlightPane.className = 'spotlight-pane';
        spotlightPane.innerHTML = createCardHTML(showstopperChannel, true);
        streamsContainer.appendChild(spotlightPane);
        initTwitchPlayer(`twitch-embed-${showstopperChannel}`, showstopperChannel);

        // 2. Stacked Pane (Takes 25% width via flex: 1, remaining space adjusts cleanly)
        const stackPane = document.createElement('div');
        stackPane.className = 'stack-pane';
        
        activeStreams.forEach(channel => {
          if (channel !== showstopperChannel) {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'stream-card';
            cardWrapper.innerHTML = `
              <div class="stream-header">
                <span>🔴 ${channel}</span>
                <div class="stream-actions">
                  <button onclick="toggleShowstopper('${channel}')" title="Spotlight">⭐</button>
                  <button onclick="removeStream('${channel}')" title="Close">✕</button>
                </div>
              </div>
              <div class="stream-content">
                <div id="twitch-embed-${channel}" class="twitch-player-target"></div>
              </div>
            `;
            stackPane.appendChild(cardWrapper);
            initTwitchPlayer(`twitch-embed-${channel}`, channel);
          }
        });
        streamsContainer.appendChild(stackPane);

      } else {
        // --- STANDARD GRID LAYOUT ---
        workspace.className = 'workspace';
        streamsContainer.className = 'streams-grid';
        streamsContainer.style.display = 'grid';
        streamsContainer.style.gridTemplateColumns = activeStreams.length === 1 ? '1fr' : 'repeat(auto-fit, minmax(400px, 1fr))';

        activeStreams.forEach(channel => {
          const card = document.createElement('div');
          card.className = 'stream-card';
          card.innerHTML = `
            <div class="stream-header">
              <span>🔴 ${channel} <span style="font-size:10px; color:var(--accent-secondary);">(720p Capped)</span></span>
              <div class="stream-actions">
                <button onclick="toggleShowstopper('${channel}')" title="Spotlight Mode">⭐</button>
                <button onclick="removeStream('${channel}')" title="Close Stream">✕</button>
              </div>
            </div>
            <div class="stream-content">
              <div id="twitch-embed-${channel}" class="twitch-player-target"></div>
            </div>
          `;
          streamsContainer.appendChild(card);
          initTwitchPlayer(`twitch-embed-${channel}`, channel);
        });
      }
    }

    function createCardHTML(channel, isSpotlight = false) {
      return `
        <div class="stream-card" style="height: 100%;">
          <div class="stream-header">
            <span>🔴 ${channel} <span style="font-size:10px; color:var(--accent-secondary);">${isSpotlight ? '(SHOWSTOPPER 50%)' : '(720p Capped)'}</span></span>
            <div class="stream-actions">
              ${isSpotlight ? `<button onclick="exitShowstopper()" title="Exit Spotlight">🔲</button>` : `<button onclick="toggleShowstopper('${channel}')" title="Spotlight">⭐</button>`}
              <button onclick="removeStream('${channel}')" title="Close">✕</button>
            </div>
          </div>
          <div class="stream-content">
            <div id="twitch-embed-${channel}" class="twitch-player-target"></div>
          </div>
        </div>
      `;
    }

    function initTwitchPlayer(elementId, channelName) {
      const options = {
        width: '100%',
        height: '100%',
        channel: channelName,
        parent: [window.location.hostname],
        muted: true,
        quality: '720p'
      };

      try {
        const player = new Twitch.Player(elementId, options);
        twitchPlayers[channelName] = player;

        player.addEventListener(Twitch.Player.VIDEO_READY, () => {
          player.play();
        });

        setTimeout(() => {
          if (player && typeof player.play === 'function') player.play();
        }, 3000);
      } catch (err) {
        console.error(`Error initializing player for ${channelName}:`, err);
      }
    }

    function addStream(channel) {
      if (!activeStreams.includes(channel)) {
        activeStreams.push(channel);
        renderWorkspace();
      }
    }

    function removeStream(channel) {
      activeStreams = activeStreams.filter(c => c !== channel);
      if (showstopperChannel === channel) showstopperChannel = null;
      renderWorkspace();
    }

    function toggleShowstopper(channel) {
      showstopperChannel = channel;
      renderWorkspace();
    }

    function exitShowstopper() {
      showstopperChannel = null;
      renderWorkspace();
    }

    // --- Inactivity Throttle Logic ---
    let inactivityTimeout = null;
    let countdownInterval = null;
    let remainingSeconds = 120;
    const INACTIVITY_LIMIT_MS = 90 * 60 * 1000;

    function resetInactivityTimer() {
      document.getElementById('inactivityModal').style.display = 'none';
      clearTimeout(inactivityTimeout);
      clearInterval(countdownInterval);
      remainingSeconds = 120;
      inactivityTimeout = setTimeout(triggerInactivityWarning, INACTIVITY_LIMIT_MS);
    }

    function triggerInactivityWarning() {
      const modal = document.getElementById('inactivityModal');
      const countdownEl = document.getElementById('inactivityCountdown');
      modal.style.display = 'flex';
      
      remainingSeconds = 120;
      countdownEl.textContent = formatCountdown(remainingSeconds);

      countdownInterval = setInterval(() => {
        remainingSeconds--;
        countdownEl.textContent = formatCountdown(remainingSeconds);

        if (remainingSeconds <= 0) {
          clearInterval(countdownInterval);
          executeBandwidthThrottle();
        }
      }, 1000);
    }

    function formatCountdown(totalSecs) {
      const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
      const secs = String(totalSecs % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function executeBandwidthThrottle() {
      document.getElementById('inactivityModal').style.display = 'none';
      if (activeStreams.length <= 1) return;
      activeStreams = [showstopperChannel || activeStreams[0]];
      showstopperChannel = null;
      renderWorkspace();
    }

    ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (document.getElementById('inactivityModal').style.display === 'none') {
          if (!inactivityTimeout) resetInactivityTimer();
        }
      }, { passive: true });
    });

    renderWorkspace();
    resetInactivityTimer();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStreamer - Multi-Stream Viewer</title>
    <style>
        :root {
            --bg-color: #0e0e10;
            --panel-bg: #18181b;
            --border-color: #2f2f35;
            --accent-color: #9146ff;
            --text-color: #efeff1;
            --text-muted: #adadb8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, Roobert, Helvetica Neue, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: var(--accent-color);
        }

        /* Smart Responsive Grid Layout Engine */
        .streams-grid {
            flex: 1;
            display: grid;
            gap: 8px;
            padding: 8px;
            overflow: hidden;
            width: 100%;
            height: calc(100vh - 60px);
        }

        .streams-grid.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .streams-grid.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .streams-grid.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .streams-grid.count-3 .stream-card:nth-child(3) { grid-column: span 2; }
        .streams-grid.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .streams-grid.count-5, .streams-grid.count-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }

        .stream-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .stream-card.dragging {
            opacity: 0.4;
            border: 2px dashed var(--accent-color);
        }

        .stream-header {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .drag-handle {
            cursor: grab;
            margin-right: 8px;
            color: var(--text-muted);
        }

        .channel-title {
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stream-controls {
            display: flex;
            gap: 6px;
        }

        .chat-toggle-btn {
            background: transparent;
            padding: 2px 6px;
            font-size: 1rem;
        }

        .stream-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .player-wrapper {
            flex: 1;
            height: 100%;
        }

        .player-wrapper iframe, .player-wrapper > div {
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-container {
            width: 300px;
            border-left: 1px solid var(--border-color);
            background: var(--bg-color);
            display: flex;
        }

        .chat-container.hidden {
            display: none;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">OmniStreamer</div>
        <div class="toolbar">
            <button id="bandwidth-saver-btn" onclick="toggleBandwidthSaver()">720p Saver: Off</button>
            <button onclick="addStreamPrompt()">+ Add Stream</button>
        </div>
    </header>

    <div id="streams-grid" class="streams-grid count-1">
        <!-- Dynamic cards injected here -->
    </div>

    <!-- Twitch Embed JS SDK -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script>
        const CLIENT_ID = 'hpipujxbz2nvmjjshhed7ewn2xvg13';
        let activePlayers = [];
        let isBandwidthSaverActive = false;
        let sampleChannels = ['twitch', 'esl_csgo'];

        function initApp() {
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('streams-grid');
            grid.innerHTML = '';
            activePlayers = [];

            // Update grid count class
            grid.className = `streams-grid count-${Math.min(sampleChannels.length, 6)}`;

            sampleChannels.forEach((channel, index) => {
                const cardId = `stream-${index}`;
                const card = createStreamCard(channel, cardId);
                grid.appendChild(card);

                // Initialize Twitch Player with reliable muted autoplay parameters
                const player = new Twitch.Embed(`twitch-embed-${cardId}`, {
                    width: '100%',
                    height: '100%',
                    channel: channel,
                    layout: 'video',
                    muted: true,
                    autoplay: true,
                    parent: [window.location.hostname]
                });

                activePlayers.push({ id: cardId, channel: channel, player: player });
            });
        }

        function createStreamCard(channelName, cardId) {
            const card = document.createElement('div');
            card.className = 'stream-card';
            card.id = `card-${cardId}`;
            card.setAttribute('draggable', 'true');

            // HTML5 Drag-and-Drop Handlers for Reordering
            card.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', cardId);
                card.classList.add('dragging');
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
            });

            card.addEventListener('dragover', (e) => {
                e.preventDefault();
                const draggingCard = document.querySelector('.dragging');
                const grid = document.getElementById('streams-grid');
                const afterElement = getDragAfterElement(grid, e.clientY);
                if (afterElement == null) {
                    grid.appendChild(draggingCard);
                } else {
                    grid.insertBefore(draggingCard, afterElement);
                }
            });

            card.innerHTML = `
                <div class="stream-header">
                    <span class="drag-handle" title="Drag to reorder">⠿</span>
                    <span class="channel-title">${channelName}</span>
                    <div class="stream-controls">
                        <button class="chat-toggle-btn" onclick="toggleIntegratedChat('${cardId}')" title="Toggle Chat">💬</button>
                        <button onclick="removeStream('${channelName}')" title="Close Stream">×</button>
                    </div>
                </div>
                <div class="stream-body">
                    <div class="player-wrapper">
                        <div id="twitch-embed-${cardId}"></div>
                    </div>
                    <div id="chat-container-${cardId}" class="chat-container hidden">
                        <iframe src="https://www.twitch.tv/embed/${channelName}/chat?parent=${window.location.hostname}" frameborder="0"></iframe>
                    </div>
                </div>
            `;

            return card;
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.stream-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function toggleIntegratedChat(cardId) {
            const chatContainer = document.getElementById(`chat-container-${cardId}`);
            chatContainer.classList.toggle('hidden');
        }

        function toggleBandwidthSaver() {
            isBandwidthSaverActive = !isBandwidthSaverActive;
            const btn = document.getElementById('bandwidth-saver-btn');
            btn.textContent = `720p Saver: ${isBandwidthSaverActive ? 'On' : 'Off'}`;
            
            activePlayers.forEach(item => {
                const embed = item.player.getPlayer();
                if (embed && typeof embed.setQuality === 'function') {
                    embed.setQuality(isBandwidthSaverActive ? '720p' : 'chunked');
                }
            });
        }

        function addStreamPrompt() {
            const channel = prompt("Enter Twitch channel name:");
            if (channel) {
                const sanitized = channel.trim().toLowerCase();
                if (/^[a-zA-Z0-9_]{4,25}$/.test(sanitized)) {
                    sampleChannels.push(sanitized);
                    renderGrid();
                } else {
                    alert("Invalid channel name format.");
                }
            }
        }

        function removeStream(channelName) {
            sampleChannels = sampleChannels.filter(c => c !== channelName);
            renderGrid();
        }

        window.onload = initApp;
    </script>
</body>
</html>

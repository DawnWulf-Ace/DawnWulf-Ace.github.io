<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniStreamer - Multi-Stream Viewer</title>
  <style>
    :root {
      --bg-color: #0e0e10;
      --card-bg: #18181b;
      --accent-color: #9146ff;
      --accent-hover: #772ce8;
      --text-color: #efeff1;
      --border-color: #2f2f35;
      --header-height: 50px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Navbar */
    header {
      height: var(--header-height);
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
    }

    .brand {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    input[type="text"] {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      outline: none;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: #26262c;
      border: 1px solid var(--border-color);
    }

    button.secondary:hover {
      background: #3a3a42;
    }

    button.active {
      background: #2e7d32;
    }

    /* Main Grid Layout */
    #streams-grid {
      flex: 1;
      display: grid;
      gap: 10px;
      padding: 10px;
      width: 100%;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
    }

    /* Responsive Smart Grid Layouts based on active count */
    #streams-grid[data-count="1"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    #streams-grid[data-count="2"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }

    #streams-grid[data-count="3"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    #streams-grid[data-count="3"] .stream-card:nth-child(3) {
      grid-column: 1 / -1;
    }

    #streams-grid[data-count="4"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    #streams-grid[data-count="5"],
    #streams-grid[data-count="6"] {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* Stream Card */
    .stream-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .stream-card.dragging {
      opacity: 0.4;
      border: 2px dashed var(--accent-color);
    }

    .card-header {
      height: 36px;
      background: #1f1f23;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.5rem;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }

    .drag-handle {
      cursor: grab;
      padding: 0 0.3rem;
      color: #adadb8;
    }

    .channel-name {
      font-weight: 600;
      font-size: 0.9rem;
      flex: 1;
      margin-left: 0.5rem;
    }

    .card-actions {
      display: flex;
      gap: 0.3rem;
    }

    .btn-icon {
      background: transparent;
      padding: 0.2rem 0.4rem;
      font-size: 0.85rem;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Container (Player + Chat) */
    .card-body {
      flex: 1;
      display: flex;
      position: relative;
      background: #000;
    }

    .player-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Sliding Integrated Chat Panel */
    .chat-panel {
      width: 320px;
      height: 100%;
      background: #18181b;
      border-left: 1px solid var(--border-color);
      display: none;
    }

    .chat-panel.open {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>OmniStreamer</span>
    </div>

    <div class="controls">
      <input type="text" id="channel-input" placeholder="Enter Twitch Channel..." />
      <button id="add-btn">Add Stream</button>
      <button id="bandwidth-btn" class="secondary">⚡ Bandwidth Saver (720p)</button>
      <button id="login-btn" class="secondary">Login with Twitch</button>
    </div>
  </header>

  <main id="streams-grid" data-count="0"></main>

  <script>
    const grid = document.getElementById('streams-grid');
    const input = document.getElementById('channel-input');
    const addBtn = document.getElementById('add-btn');
    const bandwidthBtn = document.getElementById('bandwidth-btn');
    
    let isBandwidthSaver = false;
    let draggedItem = null;

    // Helper: Update Grid Data Count Attribute
    function updateGridCount() {
      const count = grid.children.length;
      grid.setAttribute('data-count', count);
    }

    // Add Stream Card
    function addStream(channel) {
      const cleanName = channel.trim().toLowerCase();
      if (!cleanName || grid.children.length >= 6) return;

      const card = document.createElement('div');
      card.className = 'stream-card';
      card.draggable = true;
      card.dataset.channel = cleanName;

      const parentDomain = window.location.hostname || 'localhost';

      card.innerHTML = `
        <div class="card-header">
          <span class="drag-handle">⠿</span>
          <span class="channel-name">${cleanName}</span>
          <div class="card-actions">
            <button class="btn-icon chat-toggle" title="Toggle Chat">💬</button>
            <button class="btn-icon remove-btn" title="Remove Stream">✕</button>
          </div>
        </div>
        <div class="card-body">
          <div class="player-container">
            <iframe
              src="https://player.twitch.tv/?channel=${cleanName}&parent=${parentDomain}&autoplay=true"
              allowfullscreen="true">
            </iframe>
          </div>
          <div class="chat-panel">
            <iframe
              src="https://www.twitch.tv/embed/${cleanName}/chat?parent=${parentDomain}">
            </iframe>
          </div>
        </div>
      `;

      // Event Listeners for Card Features
      const removeBtn = card.querySelector('.remove-btn');
      removeBtn.addEventListener('click', () => {
        card.remove();
        updateGridCount();
      });

      const chatToggle = card.querySelector('.chat-toggle');
      const chatPanel = card.querySelector('.chat-panel');
      chatToggle.addEventListener('click', () => {
        chatPanel.classList.toggle('open');
      });

      // Drag and Drop Event Handlers
      card.addEventListener('dragstart', (e) => {
        draggedItem = card;
        card.classList.add('dragging');
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedItem = null;
      });

      card.addEventListener('dragover', (e) => {
        e.preventDefault();
      });

          const dragged

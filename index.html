<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The OmniStreamer - Twitch Multi-Stream Viewer</title>
  <style>
    :root {
      --bg-color: #0e0e10;
      --header-bg: #18181b;
      --border-color: #2d2d31;
      --text-color: #ffffff;
      --card-bg: #1f1f23;
      --input-bg: #0f0f11;
      --logo-glow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #0ff;
      --sidebar-width: 280px;
    }

    body.light-mode {
      --bg-color: #f3f4f6;
      --header-bg: #ffffff;
      --border-color: #d1d5db;
      --text-color: #111827;
      --card-bg: #e5e7eb;
      --input-bg: #ffffff;
      --logo-glow: 0 0 2px #ff00ff, 0 0 5px #ff00ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, color 0.3s; }
    
    header { height: 60px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; transition: background 0.3s; z-index: 10; }
    
    .logo-container { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-weight: 900; font-size: 24px; font-style: italic; color: var(--text-color); text-transform: uppercase; letter-spacing: 2px; text-shadow: var(--logo-glow); transition: text-shadow 0.3s; }

    .btn-icon { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); font-size: 18px; padding: 6px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: var(--card-bg); }

    .layout-controls { display: flex; gap: 8px; align-items: center; margin-right: auto; margin-left: 20px; }
    
    .btn-bandwidth { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); font-size: 13px; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-bandwidth.active { background: #9146ff; border-color: #9146ff; color: #fff; font-weight: bold; }
    .btn-bandwidth:hover { background: var(--card-bg); }
    .btn-bandwidth.active:hover { background: #772ce8; }

    .input-group { display: flex; gap: 8px; flex: 1; max-width: 500px; }
    input { flex: 1; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-color); outline: none; }
    .btn-primary { padding: 8px 16px; background: #9146ff; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
    .btn-primary:hover { background: #772ce8; }
    
    /* Layout Wrapper */
    .main-wrapper { flex: 1; display: flex; overflow: hidden; position: relative; }

    /* Twitch Sidebar */
    .sidebar { 
      width: var(--sidebar-width); 
      background: var(--header-bg); 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      transition: width 0.3s ease, margin-left 0.3s ease; 
      margin-left: 0;
      z-index: 5;
    }
    
    .sidebar.compact { --sidebar-width: 160px; }
    .sidebar.closed { margin-left: calc(var(--sidebar-width) * -1); }
    
    .sidebar-header { padding: 12px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-actions { display: flex; gap: 6px; align-items: center; }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
    
    /* Live Channel Items */
    .live-channel { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; overflow: hidden; }
    .live-channel:hover { background: var(--card-bg); border-color: var(--border-color); }
    
    .channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--border-color); }
    .channel-info { display: flex; flex-direction: column; overflow: hidden; white-space: nowrap; }
    
    .channel-name { font-weight: bold; font-size: 14px; text-overflow: ellipsis; overflow: hidden; }
    .channel-meta { font-size: 12px; color: #a1a1aa; margin-top: 2px; text-overflow: ellipsis; overflow: hidden; }
    .channel-title { font-size: 11px; color: #a1a1aa; text-overflow: ellipsis; overflow: hidden; margin-top: 4px; }
    .live-dot { color: #ef4444; font-size: 10px; margin-right: 4px; }

    .sidebar.compact .channel-meta, 
    .sidebar.compact .channel-title { display: none; }

    /* Smart Dynamic Grid System */
    .app-container { flex: 1; display: flex; overflow-y: auto; background: #000; padding: 16px; align-items: center; justify-content: center; }
    
    .streams-grid { 
      display: grid; 
      gap: 16px; 
      width: 100%; 
      height: 100%; 
      max-width: 1700px;
      max-height: 950px;
      margin: auto;
      align-content: center;
      justify-content: center;
    }

    /* Dynamic columns/rows based on item count applied via JavaScript */
    .streams-grid.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; max-width: 1200px; }
    .streams-grid.count-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
    .streams-grid.count-3 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    .streams-grid.count-3 .stream-card:nth-child(3) { grid-column: span 2; width: 60%; justify-self: center; }
    .streams-grid.count-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    .streams-grid.count-5, .streams-grid.count-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
    
    .stream-card { 
      background: var(--header-bg); 
      border-radius: 6px; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      transition: opacity 0.2s; 
      border: 1px solid var(--border-color); 
      width: 100%;
      height: 100%;
      max-height: 100%;
    }
    
    .stream-header { height: 32px; background: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; cursor: grab; user-select: none; flex-shrink: 0; }
    .stream-header:active { cursor: grabbing; }
    .drag-handle { color: #a1a1aa; margin-right: 8px; cursor: inherit; }
    .stream-card.dragging { opacity: 0.4; border: 2px dashed #ff00ff; }
    body.is-dragging iframe { pointer-events: none; }
    
    .stream-body { 
      flex: 1; 
      display: flex; 
      position: relative; 
      overflow: hidden; 
      width: 100%; 
      height: calc(100% - 32px); 
    }

    .video-container { 
      flex: 1; 
      position: relative; 
      height: 100%; 
    }
    .video-frame { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }

    /* Integrated Chat Panel Layout */
    .chat-container { 
      width: 280px; 
      height: 100%; 
      background: var(--header-bg); 
      border-left: 1px solid var(--border-color); 
      display: none; 
      flex-shrink: 0; 
    }
    .stream-card.show-chat .chat-container { display: flex; }
    .chat-frame { width: 100%; height: 100%; border: none; }

    .card-actions { display: flex; align-items: center; gap: 6px; }
    .btn-card-action { background: transparent; color: #a1a1aa; border: none; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .btn-card-action:hover { background: var(--header-bg); color: #fff; }
    .btn-card-action.active { color: #ff00ff; font-weight: bold; background: var(--border-color); }
    .btn-remove:hover { color: #ef4444; }
  </style>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
</head>
<body>

  <header>
    <div class="logo-container">
      <button class="btn-icon" onclick="toggleSidebar()" title="Toggle Dashboard">☰</button>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff00ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 5px #ff00ff);">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        <path d="M2 12h20"></path>
      </svg>
      <div class="logo-text">OMNISTREAMER</div>
    </div>
    
    <div class="layout-controls">
      <button class="btn-icon" onclick="toggleTheme()" title="Toggle Dark/Light Mode" id="themeIcon">🌓</button>
      <button class="btn-bandwidth" id="bandwidthBtn" onclick="toggleBandwidthSaver()" title="Cap all streams to 720p to save bandwidth">
        ⚡ 720p Cap
      </button>
    </div>

    <div class="input-group">
      <input type="text" id="streamUrl" placeholder="Paste Twitch channel URL or username..." onkeydown="if(event.key === 'Enter') addStream()">
      <button class="btn-primary" onclick="addStream()">Add Stream</button>
    </div>
  </header>

  <div class="main-wrapper" id="mainWrapper">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header" id="sidebarHeader">
        <span>Twitch Dashboard</span>
      </div>
      <div class="sidebar-content" id="sidebarContent">
        <div style="text-align: center; padding: 20px 10px;">
          <p style="font-size: 13px; color: #a1a1aa; margin-bottom: 12px;">Connect to Twitch to see who is live right now.</p>
          <button class="btn-primary" style="width: 100%;" onclick="loginTwitch()">Login with Twitch</button>
        </div>
      </div>
    </div>

    <div class="app-container" id="appContainer">
      <div class="streams-grid count-0" id="streamsGrid"></div>
    </div>
  </div>

  <script>
    const TWITCH_CLIENT_ID = 'hpipujxbz2nvmjjshhed7ewn2xvg13'; 
    const DOMAIN = window.location.hostname; 
    const streamsGrid = document.getElementById('streamsGrid');
    
    let draggedCard = null;
    let twitchAccessToken = null;
    let twitchUserId = null;
    let previousLiveSet = new Set();
    let isBandwidthSaverActive = false;
    let activePlayers = [];

    function updateGridClass() {
      const count = streamsGrid.children.length;
      streamsGrid.className = `streams-grid count-${Math.min(count, 6)}`;
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('closed');
    }

    function toggleCompactMode() {
      document.getElementById('sidebar').classList.toggle('compact');
    }

    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("This browser does not support desktop notifications.");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          new Notification("OmniStreamer", { body: "Live notifications are now enabled!" });
        }
      });
    }

    function loginTwitch() {
      const redirectUri = window.location.href.split('#')[0];
      const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=user:read:follows`;
      window.location.href = authUrl;
    }

    function checkTwitchAuth() {
      const hash = window.location.hash;
      if (hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        twitchAccessToken = params.get('access_token');
        localStorage.setItem('twitch_access_token', twitchAccessToken);
        window.history.replaceState(null, null, window.location.pathname);
      } else {
        twitchAccessToken = localStorage.getItem('twitch_access_token');
      }

      if (twitchAccessToken) {
        fetchTwitchUser();
      }
    }

    async function fetchTwitchUser() {
      document.getElementById('sidebarContent').innerHTML = '<div style="padding: 12px; text-align: center;">Loading...</div>';
      try {
        const res = await fetch('https://api.twitch.tv/helix/users', {
          headers: { 'Authorization': `Bearer ${twitchAccessToken}`, 'Client-Id': TWITCH_CLIENT_ID }
        });
        
        if (res.status === 401) {
          localStorage.removeItem('twitch_access_token');
          location.reload();
          return;
        }

        const data = await res.json();
        if (data.data && data.data.length > 0) {
          twitchUserId = data.data[0].id;
          
          document.getElementById('sidebarHeader').innerHTML = `
            <div style="display: flex; flex-direction: column;">
              <span>Live Follows</span>
              <span style="font-size: 11px; font-weight: normal; color: #a1a1aa;">${data.data[0].display_name}</span>
            </div>
            <div class="sidebar-actions">
              <button class="btn-icon" onclick="requestNotificationPermission()" title="Enable Desktop Notifications" style="padding: 4px 8px; font-size: 14px;">🔔</button>
              <button class="btn-icon" onclick="toggleCompactMode()" title="Toggle Compact View" style="padding: 4px 8px; font-size: 14px;">↔️</button>
            </div>
          `;
          
          fetchLiveFollows();
          setInterval(fetchLiveFollows, 120000);
        }
      } catch (err) {
        console.error("Twitch API Error", err);
      }
    }

    async function fetchLiveFollows() {
      try {
        const res = await fetch(`https://api.twitch.tv/helix/streams/followed?user_id=${twitchUserId}`, {
          headers: { 'Authorization': `Bearer ${twitchAccessToken}`, 'Client-Id': TWITCH_CLIENT_ID }
        });
        const streamsData = await res.json();
        const streams = streamsData.data;

        if (!streams || streams.length === 0) {
          renderLiveChannels([]);
          previousLiveSet.clear();
          return;
        }

        const currentLiveSet = new Set(streams.map(s => s.user_id));
        if (previousLiveSet.size > 0 && Notification.permission === "granted") {
          streams.forEach(s => {
            if (!previousLiveSet.has(s.user_id)) {
              new Notification(`${s.user_name} is now live!`, {
                body: `${s.title} (${s.game_name})`,
                icon: 'https://static.twitchcdn.net/assets/favicon-32-e29e246c157142694348.png'
              });
            }
          });
        }
        previousLiveSet = currentLiveSet;

        const userIds = streams.slice(0, 100).map(s => s.user_id);
        const queryParams = userIds.map(id => `id=${id}`).join('&');
        
        const usersRes = await fetch(`https://api.twitch.tv/helix/users?${queryParams}`, {
          headers: { 'Authorization': `Bearer ${twitchAccessToken}`, 'Client-Id': TWITCH_CLIENT_ID }
        });
        const usersData = await usersRes.json();
        
        const avatarMap = {};
        usersData.data.forEach(u => {
          avatarMap[u.id] = u.profile_image_url;
        });

        const enrichedStreams = streams.map(s => ({
          ...s,
          avatar: avatarMap[s.user_id] || ''
        }));

        renderLiveChannels(enrichedStreams);
      } catch (err) {
        console.error("Twitch API Error", err);
      }
    }

    function renderLiveChannels(channels) {
      const content = document.getElementById('sidebarContent');
      if (!channels || channels.length === 0) {
        content.innerHTML = '<div style="padding: 12px; font-size: 13px; color: #a1a1aa; text-align: center;">No followed channels are live.</div>';
        return;
      }
      
      content.innerHTML = channels.map(c => `
        <div class="live-channel" onclick="addStreamFromSidebar('${c.user_name}')">
          <img src="${c.avatar}" class="channel-avatar" alt="${c.user_name}">
          <div class="channel-info">
            <div class="channel-name">${c.user_name}</div>
            <div class="channel-meta"><span class="live-dot">●</span> ${c.viewer_count.toLocaleString()} • ${c.game_name}</div>
            <div class="channel-title">${c.title}</div>
          </div>
        </div>
      `).join('');
    }

    function addStreamFromSidebar(username) {
      document.getElementById('streamUrl').value = `https://twitch.tv/${username}`;
      addStream();
    }

    function toggleTheme() {
      const body = document.body;
      body.classList.toggle('light-mode');
      document.getElementById('themeIcon').textContent = body.classList.contains('light-mode') ? '☀️' : '🌓';
    }

    function toggleBandwidthSaver() {
      isBandwidthSaverActive = !isBandwidthSaverActive;
      const btn = document.getElementById('bandwidthBtn');
      
      if (isBandwidthSaverActive) {
        btn.classList.add('active');
        btn.innerHTML = '⚡ 720p Active';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '⚡ 720p Cap';
      }

      activePlayers.forEach(item => {
        try {
          if (isBandwidthSaverActive) {
            const qualities = item.player.getQualities();
            const targetQual = qualities.find(q => q.name.includes('720') || q.group === '720p') || qualities[qualities.length - 2];
            if (targetQual) {
              item.player.setQuality(targetQual.group || targetQual.name);
            }
          } else {
            const qualities = item.player.getQualities();
            if (qualities && qualities.length > 0) {
              item.player.setQuality(qualities[0].group || qualities[0].name);
            }
          }
        } catch (e) {
          console.error("Could not adjust stream quality:", e);
        }
      });
    }

    function parseStreamUrl(inputVal) {
      inputVal = inputVal.trim();
      if (!inputVal) return null;

      let channelName = '';
      if (inputVal.includes('twitch.tv/')) {
        channelName = inputVal.split('twitch.tv/')[1].split('/')[0].split('?')[0];
      } else {
        channelName = inputVal.replace(/[^a-zA-Z0-9_]/g, '');
      }

      return channelName ? { platform: 'twitch', id: channelName.toLowerCase() } : null;
    }

    function addStream() {
      if (streamsGrid.children.length >= 6) { alert('Maximum of 6 streams allowed.'); return; }
      const input = document.getElementById('streamUrl');
      const parsed = parseStreamUrl(input.value);
      if (!parsed) { alert('Please enter a valid Twitch URL or username.'); return; }

      const cardId = 'twitch-embed-' + Math.random().toString(36).substring(2, 9);
      const chatId = 'chat-iframe-' + cardId;

      const card = document.createElement('div');
      card.className = 'stream-card';
      card.draggable = true;
      card.dataset.cardId = cardId;
      
      card.innerHTML = `
        <div class="stream-header">
          <div style="display: flex; align-items: center;">
            <span class="drag-handle">⠿</span>
            <span><strong>${parsed.id}</strong></span>
          </div>
          <div class="card-actions">
            <button class="btn-card-action" id="btn-chat-${cardId}" title="Toggle Chat Panel" onclick="toggleIntegratedChat('${cardId}')">💬</button>
            <button class="btn-card-action btn-remove" title="Remove stream" onclick="removeStreamCard('${cardId}')">✕</button>
          </div>
        </div>
        <div class="stream-body">
          <div class="video-container">
            <div id="${cardId}" class="video-frame"></div>
          </div>
          <div class="chat-container">
            <iframe id="${chatId}" class="chat-frame" src=""></iframe>
          </div>
        </div>
      `;

      card.addEventListener('dragstart', function(e) { draggedCard = this; setTimeout(() => this.classList.add('dragging'), 0); document.body.classList.add('is-dragging'); });
      card.addEventListener('dragend', function() { draggedCard = null; this.classList.remove('dragging'); document.body.classList.remove('is-dragging'); updateGridClass(); });
      card.addEventListener('dragover', function(e) {
        e.preventDefault(); 
        if (this === draggedCard) return;
        const rect = this.getBoundingClientRect();
        streamsGrid.insertBefore(draggedCard, e.clientX < (rect.x + rect.width / 2) ? this : this.nextSibling);
      });

      streamsGrid.appendChild(card);
      input.value = '';
      updateGridClass();

      const options = {
        width: '100%',
        height: '100%',
        channel: parsed.id,
        parent: [DOMAIN],
        muted: true
      };
      
      const player = new Twitch.Player(cardId, options);
      
      player.addEventListener(Twitch.Player.READY, () => {
        activePlayers.push({ id: cardId, player: player });
        
        if (isBandwidthSaverActive) {
          try {
            const qualities = player.getQualities();
            const targetQual = qualities.find(q => q.name.includes('720') || q.group === '720p') || qualities[qualities.length - 2];
            if (targetQual) {
              player.setQuality(targetQual.group || targetQual.name);
            }
          } catch (e) {
            console.error("Initial quality cap failed:", e);
          }
        }
      });
    }

    // --- Integrated Chat Toggle Logic ---
    function toggleIntegratedChat(cardId) {
      const card = document.querySelector(`[data-card-id="${cardId}"]`);
      const btn = document.getElementById('btn-chat-' + cardId);
      const iframe = document.getElementById('chat-iframe-' + cardId);
      const channelName = card.querySelector('.stream-header strong').textContent;

      card.classList.toggle('show-chat');
      
      if (card.classList.contains('show-chat')) {
        btn.classList.add('active');
        if (!iframe.src || iframe.src === window.location.href || iframe.src === '') {
          iframe.src = `https://www.twitch.tv/embed/${channelName}/chat?parent=${DOMAIN}`;
        }
      } else {
        btn.classList.remove('active');
      }
    }

    function removeStreamCard(cardId) {
      activePlayers = activePlayers.filter(item => item.id !== cardId);
      const card = document.querySelector(`[data-card-id="${cardId}"]`);
      if (card) {
        card.remove();
        updateGridClass();
      }
    }

    checkTwitchAuth();
  </script>
</body>
</html>
